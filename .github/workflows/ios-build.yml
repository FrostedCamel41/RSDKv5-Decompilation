
name: iOS Baseline Build
# Test with implicit Xcode dependencies disabled
# Rebuild after SDL2 header fix

on:
  workflow_dispatch:
  push:
    branches:
      - ios-crt-filters
      - ios-original-crt-metal

jobs:
  ios-build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available schemes
        run: |
          xcodebuild -list \
            -project RSDKv5.xcodeproj

      
      - name: Inspect SDL iOS project
        run: |
          echo "Checking SDL Xcode project..."
          find dependencies/ios -name SDL.xcodeproj -print
          echo "Available SDL targets:"
          xcodebuild -list \
            -project dependencies/ios/SDL/Xcode/SDL/SDL.xcodeproj
    
      - name: Validate native CRT-Sharp Metal shader
        run: |
          xcrun -sdk iphoneos metal \
            -c RSDKv5/Shaders/Metal/CRT-Yeetron.metal \
            -o /tmp/CRT-Yeetron.air
          echo "CRT-Sharp Metal shader compiled successfully" 
      
      - name: Inspect SDL2 Metal texture internals
        run: |
          echo "SDL2 revision:"
          git -C dependencies/ios/SDL rev-parse HEAD

          echo "Metal texture implementation:"
          grep -n -E \
            'METAL_TextureData|METAL_CreateTexture|METAL_SetRenderTarget' \
            dependencies/ios/SDL/src/render/metal/SDL_render_metal.m | head -25

          echo "SDL2 framework project:"
          test -f dependencies/ios/SDL/Xcode/SDL/SDL.xcodeproj/project.pbxproj
      
      - name: Prepare SDL2 Metal integration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dependencies/ios/SDL/src/render/metal/SDL_render_metal.m")
          source = path.read_text()

          marker = "/* RSDK iOS CRT Metal integration point */"

          if marker in source:
              raise SystemExit("Patch marker already exists")

          anchor = "@interface METAL_TextureData : NSObject"

          if source.count(anchor) != 1:
              raise SystemExit("Expected SDL2 Metal texture class not found exactly once")

          
          bridge = """
          /* RSDK iOS CRT texture bridge */
          __attribute__((visibility("default"), used))
          void *RSDK_GetMetalTexture(SDL_Texture *texture)
          {
              if (!texture || !texture->driverdata)
                  return NULL;

              METAL_TextureData *data =
                  (__bridge METAL_TextureData *)texture->driverdata;
              return (__bridge void *)data.mtltexture;
          }
          """

          source = source.replace(
              anchor,
              marker + "\n" + anchor,
              1
          )

          implementation = "@implementation METAL_TextureData\n@end"

          if source.count(implementation) != 1:
              raise SystemExit("SDL2 texture implementation anchor not found")

          source = source.replace(
              implementation,
              implementation + "\n" + bridge,
              1
          )

          path.write_text(source)

          print("SDL2 Metal integration patch = APPLIED")
          PY
      - name: Build SDL2 iOS framework
        run: |
          xcodebuild \
            -project dependencies/ios/SDL/Xcode/SDL/SDL.xcodeproj \
            -scheme Framework-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Check SDL2 Metal texture bridge symbol
        run: |
          echo "Locating compiled SDL2 binaries"
          find build -type f \( -name SDL2 -o -name 'libSDL2*.a' \) -print
          echo "Checking Metal bridge symbols"
          find build -type f \( -name SDL2 -o -name 'libSDL2*.a' \) -exec sh -c 'for file do echo "Checking $file"; xcrun nm -a "$file" | grep RSDK_GetMetalTexture || true; done' sh {} +
          echo "Locating compiled SDL2 Metal renderer objects"
          find build -type f -name 'SDL_render_metal.o' -print
          find build -type f -name 'SDL_render_metal.o' -exec xcrun nm -a {} \; | grep RSDK_GetMetalTexture || true
          echo "Checking final SDL2 framework exports"
          xcrun nm -gU build/Build/Products/Release-iphoneos/SDL2.framework/SDL2 | grep RSDK_GetMetalTexture || true
          xcrun otool -l build/Build/Products/Release-iphoneos/SDL2.framework/SDL2 | grep -A 5 LC_DYLD_EXPORTS_TRIE || true
      - name: Build Ogg Vorbis and Theora iOS libraries
        run: |
          set -e

          xcodebuild \
            -project dependencies/ios/ogg/ios/Ogg.xcodeproj \
            -target libogg \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/Build/Products/Release-iphoneos" \
            ARCHS=arm64 \
            build

          xcodebuild \
            -project dependencies/ios/vorbis/macosx/Vorbis.xcodeproj \
            -scheme 'libvorbis (static)' \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project dependencies/ios/theora/macosx/Theora.xcodeproj \
            -scheme 'libtheoradec (static)' \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      
      
      
      
      - name: Inspect SDL target references
        run: |
          echo "SDL target dependencies:"
          sed -n '/Begin PBXTargetDependency section/,/End PBXTargetDependency section/p' RSDKv5.xcodeproj/project.pbxproj
          echo "SDL framework references:"
          grep -n -C 5 'F2F153A32A070C3400C57723' RSDKv5.xcodeproj/project.pbxproj || true



      - name: Inspect main build dependencies
        run: |
          xcodebuild \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -showBuildSettings
      - name: Inspect game and mod frameworks
        run: |
          echo "Game submodule:"
          git submodule status Game
          echo "Framework projects:"
          find Game Mods -name '*.xcodeproj' -print
          echo "Game schemes:"
          xcodebuild -list -project Game/SonicMania.xcodeproj
          echo "Touch controls schemes:"
          xcodebuild -list -project Mods/ManiaTouchControls/ManiaTouchControls.xcodeproj
          echo "Ultrawide schemes:"
          xcodebuild -list -project Mods/UltrawideMania/UltrawideMania.xcodeproj     

      - name: Build Sonic Mania frameworks
        run: |
          set -e

                    for entry in \
            "Game/SonicMania.xcodeproj|SonicMania" \
            "Mods/GameAPI/GameAPI.xcodeproj|GameAPI" \
            "Mods/ManiaTouchControls/ManiaTouchControls.xcodeproj|ManiaTouchControls" \
            "Mods/UltrawideMania/UltrawideMania.xcodeproj|UltrawideMania"
          do
            project="${entry%%|*}"
            target="${entry##*|}"

            xcodebuild \
              -project "$project" \
              -target "$target" \
              -configuration Release \
              -sdk iphoneos \
              CONFIGURATION_BUILD_DIR="$PWD/build/Build/Products/Release-iphoneos" \
              CODE_SIGNING_ALLOWED=NO \
              ARCHS=arm64 \
              build
          done
      
      - name: Compile CRT-Sharp Metal shader
        run: |
          set -e
          mkdir -p build/MetalShaders

          xcrun -sdk iphoneos metal \
            -c RSDKv5/Shaders/Metal/CRT-Yeetron.metal \
            -o build/MetalShaders/CRT-Yeetron.air

          xcrun -sdk iphoneos metallib \
            build/MetalShaders/CRT-Yeetron.air \
            -o build/MetalShaders/CRT-Yeetron.metallib

          echo "CRT-Sharp Metal shader compiled successfully"
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project RSDKv5.xcodeproj \
            -scheme RSDKv5 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              OTHER_LDFLAGS='$(inherited) -framework Metal' \
              INFOPLIST_FILE= \
              GENERATE_INFOPLIST_FILE=YES \
              build
      - name: Enable iOS Files access
        run: |
          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c \
            "Set :UIFileSharingEnabled true" \
            "$APP/Info.plist" || \
          /usr/libexec/PlistBuddy -c \
            "Add :UIFileSharingEnabled bool true" \
            "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c \
            "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$APP/Info.plist"
      
      - name: Bundle CRT-Sharp Metal shader
        run: |
          set -e

          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"

          SHADER="build/MetalShaders/CRT-Yeetron.metallib"
          test -s "$SHADER"

          mkdir -p "$APP/Shaders"
          cp "$SHADER" "$APP/Shaders/CRT-Yeetron.metallib"

          echo "Bundled Metal shader:"
          ls -lh "$APP/Shaders/CRT-Yeetron.metallib"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          cp -R "$APP" Payload/
          zip -qr SonicMania-iOS-Test.ipa Payload

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: SonicMania-iOS-Baseline
          path: SonicMania-iOS-Test.ipa
          retention-days: 7
